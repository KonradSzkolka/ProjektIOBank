<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Guild bank</title>
</head>
<body>
<h2 th:text="${title}">Guild bank</h2>

<table border="1">
    <tr>
        <th>Guild</th>
        <th>Balance</th>
    </tr>
    <tr th:each="b : ${balances}">
        <td th:text="${b.member.accountName}">Account</td>
        <td th:text="${b.member.role}">Role</td>
        <td th:text="${b.totalCoins}">0</td>
    </tr>
</table>

</body>
</html>
